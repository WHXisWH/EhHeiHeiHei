services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: parallelife
      POSTGRES_PASSWORD: parallelife
      POSTGRES_DB: parallelife
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallelife -d parallelife"]
      interval: 5s
      timeout: 3s
      retries: 20

